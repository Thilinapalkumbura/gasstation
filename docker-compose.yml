version: '3.9'

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gasstation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gasstation
      POSTGRES_USER: gasstation
      POSTGRES_PASSWORD: gasstation_dev_2024
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gasstation']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gasstation_redis
    restart: unless-stopped
    command: redis-server --requirepass gasstation_redis_2024
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--pass', 'gasstation_redis_2024', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin (optional, dev only) ───────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gasstation_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gasstation.lk
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '5050:80'
    depends_on:
      - postgres
    profiles:
      - tools  # only starts with: docker compose --profile tools up

volumes:
  postgres_data:
  redis_data:
