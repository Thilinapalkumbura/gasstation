version: '3.9'

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gasstation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gasstation_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gasstation_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - gasstation_network
    healthcheck:
      test: ['CMD', 'redis-cli', '--pass', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: gasstation_api
    restart: unless-stopped
    environment:
      NODE_ENV:                        production
      PORT:                            3001
      DATABASE_URL:                    postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL:                       redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET:               ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET:              ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN_SECONDS:   ${JWT_ACCESS_EXPIRES_IN_SECONDS:-900}
      JWT_REFRESH_EXPIRES_IN_DAYS:     ${JWT_REFRESH_EXPIRES_IN_DAYS:-30}
      CLIENT_URL:                      ${CLIENT_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gasstation_network

  # ── Next.js Web ────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${CLIENT_URL}
    container_name: gasstation_web
    restart: unless-stopped
    environment:
      NODE_ENV:            production
      NEXT_PUBLIC_API_URL: ${CLIENT_URL}
    depends_on:
      - api
    networks:
      - gasstation_network

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: gasstation_nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - gasstation_network

volumes:
  postgres_data:
  redis_data:

networks:
  gasstation_network:
    driver: bridge
